<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
  <title>Edit Karyawan — Panel Admin Presensi QR</title>
  <desc>Prototype vektor halaman edit karyawan admin sesuai formulir dan design system project Presensi QR. Data contoh mengikuti seeder; impor SVG ini ke Figma untuk mengedit.</desc>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity=".05"/>
    </filter>
  </defs>
  <rect width="1440" height="920" fill="#ffffff"/>

  <g id="header">
    <rect width="1440" height="84" fill="#ffffff"/>
    <g id="brand">
      <text x="80" y="40" fill="#121212" font-family="Poppins, sans-serif" font-size="22" font-weight="600">Presensi</text>
      <text x="179" y="40" fill="#dc143c" font-family="Poppins, sans-serif" font-size="22" font-weight="600">QR</text>
      <text x="80" y="63" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">Panel Admin</text>
    </g>
    <g id="account-actions">
      <circle cx="1124" cy="42" r="20" fill="#fce8ec"/>
      <text x="1124" y="47" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">AD</text>
      <text x="1155" y="47" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Admin</text>
      <g id="theme-toggle">
        <rect x="1212" y="22" width="40" height="40" rx="12" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
        <path d="M1234.3 32.2a9 9 0 1 0 9.5 12.6 7.1 7.1 0 0 1-9.5-12.6Z" fill="none" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="logout-button">
        <rect x="1268" y="22" width="92" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="1314" y="47" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Keluar</text>
      </g>
    </g>
  </g>
  <path d="M0 83.5H1440" stroke="#eaeaea"/>

  <g id="admin-navigation" font-family="Inter, sans-serif" font-size="14">
    <text x="80" y="116" fill="#4a4a4a">Dashboard</text>
    <rect x="185" y="84" width="80" height="53" fill="#ffffff"/>
    <text x="192" y="116" fill="#121212" font-weight="600">Karyawan</text>
    <path d="M192 135.5H265" stroke="#dc143c" stroke-width="2"/>
    <text x="283" y="116" fill="#4a4a4a">Divisi</text>
    <text x="347" y="116" fill="#4a4a4a">Jam Kerja</text>
    <text x="444" y="116" fill="#4a4a4a">Persetujuan</text>
    <text x="568" y="116" fill="#4a4a4a">Presensi Manual</text>
    <text x="713" y="116" fill="#4a4a4a">Jaringan</text>
    <text x="802" y="116" fill="#4a4a4a">Perangkat</text>
    <text x="904" y="116" fill="#4a4a4a">Laporan</text>
  </g>
  <path d="M0 137.5H1440" stroke="#eaeaea"/>

  <g id="page-content">
    <text x="80" y="192" fill="#121212" font-family="Poppins, sans-serif" font-size="28" font-weight="600">Edit Karyawan</text>

    <g id="employee-form-card">
      <rect x="80" y="216" width="672" height="590" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>

      <g id="name-field">
        <text x="104" y="258" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Nama</text>
        <rect x="104" y="270" width="296" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="120" y="300" fill="#121212" font-family="Inter, sans-serif" font-size="16">Budi Santoso</text>
      </g>
      <g id="nip-field">
        <text x="416" y="258" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">NIP</text>
        <rect x="416" y="270" width="312" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="432" y="300" fill="#121212" font-family="Inter, sans-serif" font-size="16">KRY001</text>
      </g>

      <g id="email-field">
        <text x="104" y="350" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Email</text>
        <rect x="104" y="362" width="296" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="120" y="392" fill="#121212" font-family="Inter, sans-serif" font-size="15">karyawan1@presensi.test</text>
      </g>
      <g id="phone-field">
        <text x="416" y="350" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">No. HP</text>
        <rect x="416" y="362" width="312" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="432" y="392" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="16">08xxxxxxxxxx</text>
      </g>

      <g id="division-field">
        <text x="104" y="442" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Divisi / Departemen</text>
        <rect x="104" y="454" width="296" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="120" y="484" fill="#121212" font-family="Inter, sans-serif" font-size="16">IT</text>
        <path d="m370 474 6 6 6-6" fill="none" stroke="#6b6b6b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="shift-field">
        <text x="416" y="442" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Jam Kerja (Shift)</text>
        <rect x="416" y="454" width="312" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="432" y="484" fill="#121212" font-family="Inter, sans-serif" font-size="15">Reguler (08:00-17:00)</text>
        <path d="m698 474 6 6 6-6" fill="none" stroke="#6b6b6b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g id="role-field">
        <text x="104" y="534" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Role</text>
        <rect x="104" y="546" width="296" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="120" y="576" fill="#121212" font-family="Inter, sans-serif" font-size="16">Karyawan</text>
        <path d="m370 566 6 6 6-6" fill="none" stroke="#6b6b6b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="password-field">
        <text x="416" y="534" fill="#121212" font-family="Inter, sans-serif" font-size="13" font-weight="600" letter-spacing=".2">Password (kosongkan jika tidak diganti)</text>
        <rect x="416" y="546" width="312" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <g fill="none" stroke="#6b6b6b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M682 570s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
          <circle cx="692" cy="570" r="3"/>
        </g>
      </g>

      <g id="active-account-checkbox">
        <rect x="104" y="630" width="18" height="18" rx="4" fill="#dc143c" stroke="#dc143c"/>
        <path d="m108 639 4 4 7-8" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="132" y="644" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Akun aktif</text>
      </g>

      <g id="form-actions">
        <rect x="104" y="686" width="108" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="158" y="711" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Simpan</text>
        <rect x="220" y="686" width="96" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="268" y="711" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Batal</text>
      </g>
    </g>
  </g>
</svg>
