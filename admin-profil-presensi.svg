<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180">
  <title>Profil Saya — Panel Admin Presensi QR</title>
  <desc>Prototype vektor halaman profil admin, mengikuti halaman profil bersama project Presensi QR. Data contoh mengikuti seeder; impor SVG ini ke Figma untuk mengedit.</desc>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity=".05"/>
    </filter>
  </defs>
  <rect width="1440" height="1180" fill="#ffffff"/>

  <g id="header">
    <rect width="1440" height="84" fill="#ffffff"/>
    <g id="brand">
      <text x="80" y="40" fill="#121212" font-family="Poppins, sans-serif" font-size="22" font-weight="600">Presensi</text>
      <text x="179" y="40" fill="#dc143c" font-family="Poppins, sans-serif" font-size="22" font-weight="600">QR</text>
      <text x="80" y="63" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">Panel Admin</text>
    </g>
    <g id="account-actions">
      <circle cx="1124" cy="42" r="20" fill="#fce8ec"/>
      <text x="1124" y="47" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600">AK</text>
      <text x="1155" y="47" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Admin Kantor</text>
      <g id="theme-toggle">
        <rect x="1212" y="22" width="40" height="40" rx="12" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
        <path d="M1234.3 32.2a9 9 0 1 0 9.5 12.6 7.1 7.1 0 0 1-9.5-12.6Z" fill="none" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="logout-button">
        <rect x="1268" y="22" width="92" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="1314" y="47" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Keluar</text>
      </g>
    </g>
  </g>
  <path d="M0 83.5H1440" stroke="#eaeaea"/>

  <g id="admin-navigation" font-family="Inter, sans-serif" font-size="14">
    <text x="80" y="116" fill="#4a4a4a">Dashboard</text>
    <text x="192" y="116" fill="#4a4a4a">Karyawan</text>
    <text x="283" y="116" fill="#4a4a4a">Divisi</text>
    <text x="347" y="116" fill="#4a4a4a">Jam Kerja</text>
    <text x="444" y="116" fill="#4a4a4a">Persetujuan</text>
    <text x="568" y="116" fill="#4a4a4a">Presensi Manual</text>
    <text x="713" y="116" fill="#4a4a4a">Jaringan</text>
    <text x="802" y="116" fill="#4a4a4a">Perangkat</text>
    <text x="904" y="116" fill="#4a4a4a">Laporan</text>
  </g>
  <path d="M0 137.5H1440" stroke="#eaeaea"/>

  <g id="page-content">
    <text x="80" y="192" fill="#121212" font-family="Poppins, sans-serif" font-size="28" font-weight="600">Profil Saya</text>

    <g id="identity-card">
      <rect x="80" y="216" width="1280" height="184" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <circle cx="156" cy="292" r="48" fill="#fce8ec"/>
      <text x="156" y="301" fill="#dc143c" text-anchor="middle" font-family="Poppins, sans-serif" font-size="28" font-weight="600">AK</text>
      <text x="228" y="275" fill="#121212" font-family="Poppins, sans-serif" font-size="28" font-weight="600">Admin Kantor</text>
      <text x="228" y="301" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">admin@presensi.test</text>
      <rect x="228" y="321" width="65" height="28" rx="4" fill="#fce8ec"/>
      <text x="260.5" y="340" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">Admin</text>
      <rect x="301" y="321" width="94" height="28" rx="4" fill="#f5f3f3"/>
      <text x="348" y="340" fill="#4a4a4a" text-anchor="middle" font-family="Inter, sans-serif" font-size="13">NIP ADM001</text>
      <rect x="403" y="321" width="116" height="28" rx="4" fill="#f5f3f3"/>
      <text x="461" y="340" fill="#4a4a4a" text-anchor="middle" font-family="Inter, sans-serif" font-size="13">Tanpa divisi</text>
      <rect x="527" y="321" width="235" height="28" rx="4" fill="#f5f3f3"/>
      <text x="644.5" y="340" fill="#4a4a4a" text-anchor="middle" font-family="Inter, sans-serif" font-size="13">Shift Reguler · 08:00–17:00</text>
    </g>

    <g id="personal-details-card">
      <rect x="80" y="424" width="840" height="620" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <text x="104" y="466" fill="#121212" font-family="Poppins, sans-serif" font-size="22" font-weight="600">Data Diri</text>

      <g id="profile-photo-controls">
        <circle cx="160" cy="548" r="48" fill="#fce8ec"/>
        <text x="160" y="557" fill="#dc143c" text-anchor="middle" font-family="Poppins, sans-serif" font-size="27" font-weight="600">AK</text>
        <rect x="232" y="510" width="120" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="292" y="535" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Pilih foto</text>
        <text x="232" y="576" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">JPG, PNG, atau WEBP. Maksimal 2 MB.</text>
      </g>

      <g id="full-name-field">
        <text x="104" y="628" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Nama lengkap</text>
        <rect x="104" y="640" width="792" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="120" y="670" fill="#121212" font-family="Inter, sans-serif" font-size="16">Admin Kantor</text>
      </g>

      <g id="email-field">
        <text x="104" y="729" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Email</text>
        <rect x="104" y="741" width="380" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="120" y="771" fill="#121212" font-family="Inter, sans-serif" font-size="16">admin@presensi.test</text>
      </g>

      <g id="phone-field">
        <text x="504" y="729" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">No. HP</text>
        <rect x="504" y="741" width="392" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="520" y="771" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="16">08xxxxxxxxxx</text>
      </g>

      <g id="save-profile-button">
        <rect x="104" y="824" width="214" height="48" rx="12" fill="#dc143c"/>
        <text x="211" y="854" fill="#ffffff" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Simpan Perubahan</text>
      </g>
    </g>

    <g id="security-card">
      <rect x="944" y="424" width="416" height="508" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <text x="968" y="466" fill="#121212" font-family="Poppins, sans-serif" font-size="22" font-weight="600">Keamanan</text>

      <g id="current-password-field">
        <text x="968" y="507" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Password saat ini</text>
        <rect x="968" y="519" width="368" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="984" y="550" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="18">••••••••</text>
        <g fill="none" stroke="#6b6b6b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1295 543s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
          <circle cx="1305" cy="543" r="3"/>
        </g>
      </g>

      <g id="new-password-field">
        <text x="968" y="608" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Password baru</text>
        <rect x="968" y="620" width="368" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="984" y="651" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="18">••••••••</text>
        <g fill="none" stroke="#6b6b6b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1295 644s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
          <circle cx="1305" cy="644" r="3"/>
        </g>
      </g>

      <g id="confirm-password-field">
        <text x="968" y="709" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Ulangi password baru</text>
        <rect x="968" y="721" width="368" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="984" y="752" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="18">••••••••</text>
        <g fill="none" stroke="#6b6b6b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1295 745s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
          <circle cx="1305" cy="745" r="3"/>
        </g>
      </g>

      <g id="change-password-button">
        <rect x="968" y="803" width="368" height="48" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="1152" y="833" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Ganti Password</text>
      </g>
    </g>
  </g>
</svg>
