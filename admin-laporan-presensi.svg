        <text x="270" y="652" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="13">IT</text>
        <text x="390" y="652" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="13">08:00</text>
        <text x="472" y="652" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="13">17:00</text>
        <rect x="554" y="633" width="48" height="23" rx="4" fill="#e7f6eb"/>
        <text x="578" y="649" fill="#1e7e34" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600">Hadir</text>
        <text x="680" y="652" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="13">-</text>
        <text x="762" y="652" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="13">1 j 00 mnt</text>
        <circle cx="886" cy="648" r="17" fill="#fce8ec" stroke="#ffffff" stroke-width="2"/>
        <text x="886" y="652" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600">BS</text>
        <path d="M911 648h17m-5-5 5 5-5 5" fill="none" stroke="#c5c5c5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="937" y="631" width="40" height="40" rx="8" fill="#d4e4dc"/>
        <circle cx="957" cy="646" r="7" fill="#c08a68"/>
        <path d="M944 667q2-12 13-12t13 12" fill="#365b4b"/>
        <text x="957" y="687" fill="#6b6b6b" text-anchor="middle" font-family="Inter, sans-serif" font-size="11">Masuk</text>
        <rect x="992" y="631" width="40" height="40" rx="8" fill="#d9e4ed"/>
        <circle cx="1012" cy="646" r="7" fill="#c08a68"/>
        <path d="M999 667q2-12 13-12t13 12" fill="#435b78"/>
        <text x="1012" y="687" fill="#6b6b6b" text-anchor="middle" font-family="Inter, sans-serif" font-size="11">Pulang</text>
      </g>
      <path d="M80 697H1360" stroke="#eaeaea"/>

      <g id="today-row-siti">
        <text x="104" y="730" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="13">Siti Aminah</text>
        <text x="270" y="730" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="13">HRD</text>
        <text x="390" y="730" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="13">08:21</text>
        <text x="472" y="730" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="13">-</text>
        <rect x="554" y="711" width="75" height="23" rx="4" fill="#fef3c7"/>
        <text x="591.5" y="727" fill="#92400e" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600">Terlambat</text>
        <text x="680" y="730" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="13">21 mnt</text>
        <text x="762" y="730" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="13">-</text>
        <circle cx="886" cy="726" r="17" fill="#fce8ec" stroke="#ffffff" stroke-width="2"/>
        <text x="886" y="730" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600">SA</text>
        <path d="M911 726h17m-5-5 5 5-5 5" fill="none" stroke="#c5c5c5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="937" y="709" width="40" height="40" rx="8" fill="#eadbd2"/>
        <circle cx="957" cy="724" r="7" fill="#9e684e"/>
        <path d="M944 745q2-12 13-12t13 12" fill="#704a60"/>
        <text x="957" y="765" fill="#6b6b6b" text-anchor="middle" font-family="Inter, sans-serif" font-size="11">Masuk</text>
      </g>
      <path d="M80 775H1360" stroke="#eaeaea"/>
      <text x="104" y="787" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="12">Foto verifikasi dapat diklik untuk pratinjau.</text>
