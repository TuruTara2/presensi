    <g id="previous-day-card">
      <rect x="80" y="816" width="1280" height="100" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <path d="M81 828a11 11 0 0 1 11-11h1258a10 10 0 0 1 10 10v47H81Z" fill="#f5f3f3"/>
      <text x="104" y="850" fill="#121212" font-family="Poppins, sans-serif" font-size="18" font-weight="600">Senin, 9 November 2026</text>
      <text x="1336" y="850" fill="#6b6b6b" text-anchor="end" font-family="Inter, sans-serif" font-size="14">0 presensi</text>
      <path d="M80 875H1360" stroke="#eaeaea"/>
      <text x="104" y="902" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="14">Tidak ada data presensi.</text>
    </g>

    <g id="future-day-card">
      <rect x="80" y="936" width="1280" height="100" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <path d="M81 948a11 11 0 0 1 11-11h1258a10 10 0 0 1 10 10v47H81Z" fill="#f5f3f3"/>
      <text x="104" y="970" fill="#121212" font-family="Poppins, sans-serif" font-size="18" font-weight="600">Rabu, 11 November 2026</text>
      <text x="1336" y="970" fill="#6b6b6b" text-anchor="end" font-family="Inter, sans-serif" font-size="14">0 presensi</text>
      <path d="M80 995H1360" stroke="#eaeaea"/>
      <text x="104" y="1022" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="14">Belum berlangsung.</text>
