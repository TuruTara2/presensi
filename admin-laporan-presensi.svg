    <g id="more-future-days">
      <rect x="80" y="1056" width="1280" height="100" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <path d="M81 1068a11 11 0 0 1 11-11h1258a10 10 0 0 1 10 10v47H81Z" fill="#f5f3f3"/>
      <text x="104" y="1090" fill="#121212" font-family="Poppins, sans-serif" font-size="18" font-weight="600">Kamis, 12 November 2026</text>
      <text x="1336" y="1090" fill="#6b6b6b" text-anchor="end" font-family="Inter, sans-serif" font-size="14">0 presensi</text>
      <path d="M80 1115H1360" stroke="#eaeaea"/>
      <text x="104" y="1142" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="14">Belum berlangsung.</text>
    </g>
  </g>
</svg>
