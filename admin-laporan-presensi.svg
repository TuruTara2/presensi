<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280">
  <title>Rekapitulasi &amp; Export Laporan — Panel Admin Presensi QR</title>
  <desc>Prototype vektor halaman laporan presensi admin, mengikuti struktur dan komponen project Presensi QR. Data contoh untuk tampilan; impor SVG ini ke Figma untuk mengedit.</desc>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity=".05"/>
    </filter>
  </defs>
  <rect width="1440" height="1280" fill="#ffffff"/>

  <g id="header">
    <rect width="1440" height="84" fill="#ffffff"/>
    <g id="brand">
      <text x="80" y="40" fill="#121212" font-family="Poppins, sans-serif" font-size="22" font-weight="600">Presensi</text>
      <text x="179" y="40" fill="#dc143c" font-family="Poppins, sans-serif" font-size="22" font-weight="600">QR</text>
      <text x="80" y="63" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">Panel Admin</text>
    </g>
    <g id="account-actions">
      <circle cx="1124" cy="42" r="20" fill="#f5f3f3"/>
      <text x="1124" y="47" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">AD</text>
      <text x="1155" y="47" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Admin</text>
      <g id="theme-toggle">
        <rect x="1212" y="22" width="40" height="40" rx="12" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
        <path d="M1234.3 32.2a9 9 0 1 0 9.5 12.6 7.1 7.1 0 0 1-9.5-12.6Z" fill="none" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="logout-button">
        <rect x="1268" y="22" width="92" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="1314" y="47" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Keluar</text>
      </g>
    </g>
  </g>
  <path d="M0 83.5H1440" stroke="#eaeaea"/>

  <g id="admin-navigation" font-family="Inter, sans-serif" font-size="14">
    <text x="80" y="116" fill="#4a4a4a">Dashboard</text>
    <text x="192" y="116" fill="#4a4a4a">Karyawan</text>
    <text x="283" y="116" fill="#4a4a4a">Divisi</text>
    <text x="347" y="116" fill="#4a4a4a">Jam Kerja</text>
    <text x="444" y="116" fill="#4a4a4a">Persetujuan</text>
    <text x="568" y="116" fill="#4a4a4a">Presensi Manual</text>
    <text x="713" y="116" fill="#4a4a4a">Jaringan</text>
    <text x="802" y="116" fill="#4a4a4a">Perangkat</text>
    <rect x="897" y="84" width="70" height="53" fill="#ffffff"/>
    <text x="904" y="116" fill="#121212" font-weight="600">Laporan</text>
    <path d="M904 135.5H960" stroke="#dc143c" stroke-width="2"/>
  </g>
  <path d="M0 137.5H1440" stroke="#eaeaea"/>

  <g id="page-content">
    <text x="80" y="192" fill="#121212" font-family="Poppins, sans-serif" font-size="28" font-weight="600">Rekapitulasi &amp; Export Laporan</text>

    <g id="report-filters">
      <rect x="80" y="216" width="1280" height="112" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <g id="month-filter">
        <text x="104" y="250" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Bulan</text>
        <rect x="104" y="262" width="220" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="120" y="292" fill="#121212" font-family="Inter, sans-serif" font-size="14">November 2026</text>
        <rect x="288" y="275" width="16" height="15" rx="2" fill="none" stroke="#6b6b6b" stroke-width="1.5"/>
        <path d="M292 272v6m8-6v6m-12 3h16" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <g id="division-filter">
        <text x="348" y="250" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Divisi</text>
        <rect x="348" y="262" width="220" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="364" y="292" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Semua</text>
        <path d="m546 281 6 6 6-6" fill="none" stroke="#6b6b6b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="export-week-button">
        <rect x="812" y="266" width="246" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <path d="M831 279v14m-5-5 5 5 5-5m-8 9h16" fill="none" stroke="#dc143c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="941" y="291" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">Export Minggu 3 (CSV)</text>
      </g>
      <g id="export-month-button">
        <rect x="1070" y="266" width="266" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <path d="M1089 279v14m-5-5 5 5 5-5m-8 9h16" fill="none" stroke="#dc143c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="1216" y="291" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">Export 1 Bulan (CSV)</text>
      </g>
    </g>

    <text x="80" y="362" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">November 2026</text>
    <g id="week-selector" font-family="Inter, sans-serif">
      <rect x="80" y="376" width="146" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
      <text x="153" y="401" fill="#dc143c" text-anchor="middle" font-size="13" font-weight="600">Minggu 1 <tspan font-size="11">(1 Nov)</tspan></text>
      <rect x="234" y="376" width="146" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
      <text x="307" y="401" fill="#dc143c" text-anchor="middle" font-size="13" font-weight="600">Minggu 2 <tspan font-size="11">(2-8 Nov)</tspan></text>
      <rect x="388" y="376" width="146" height="40" rx="12" fill="#dc143c"/>
      <text x="461" y="401" fill="#ffffff" text-anchor="middle" font-size="13" font-weight="600">Minggu 3 <tspan font-size="11" opacity=".8">(9-15 Nov)</tspan></text>
      <rect x="542" y="376" width="146" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
      <text x="615" y="401" fill="#dc143c" text-anchor="middle" font-size="13" font-weight="600">Minggu 4 <tspan font-size="11">(16-22 Nov)</tspan></text>
      <rect x="696" y="376" width="146" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
      <text x="769" y="401" fill="#dc143c" text-anchor="middle" font-size="13" font-weight="600">Minggu 5 <tspan font-size="11">(23-29 Nov)</tspan></text>
      <rect x="850" y="376" width="146" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
      <text x="923" y="401" fill="#dc143c" text-anchor="middle" font-size="13" font-weight="600">Minggu 6 <tspan font-size="11">(30 Nov)</tspan></text>
    </g>

    <g id="weekly-summary">
      <rect x="80" y="436" width="132" height="40" rx="12" fill="#ffffff" stroke="#eaeaea"/>
      <text x="96" y="461" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Hadir: <tspan fill="#121212" font-weight="600">42</tspan></text>
      <rect x="222" y="436" width="154" height="40" rx="12" fill="#ffffff" stroke="#eaeaea"/>
      <text x="238" y="461" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Terlambat: <tspan fill="#121212" font-weight="600">8</tspan></text>
      <rect x="386" y="436" width="112" height="40" rx="12" fill="#ffffff" stroke="#eaeaea"/>
      <text x="402" y="461" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Izin: <tspan fill="#121212" font-weight="600">2</tspan></text>
      <rect x="508" y="436" width="112" height="40" rx="12" fill="#ffffff" stroke="#eaeaea"/>
      <text x="524" y="461" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Sakit: <tspan fill="#121212" font-weight="600">1</tspan></text>
      <rect x="630" y="436" width="112" height="40" rx="12" fill="#ffffff" stroke="#eaeaea"/>
      <text x="646" y="461" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Cuti: <tspan fill="#121212" font-weight="600">1</tspan></text>
      <rect x="752" y="436" width="218" height="40" rx="12" fill="#ffffff" stroke="#eaeaea"/>
      <text x="768" y="461" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Total lembur: <tspan fill="#121212" font-weight="600">12 j 30 mnt</tspan></text>
    </g>

    <g id="today-attendance-card">
      <rect x="80" y="496" width="1280" height="300" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <path d="M81 508a11 11 0 0 1 11-11h1258a10 10 0 0 1 10 10v55H81Z" fill="#f5f3f3"/>
      <text x="104" y="536" fill="#121212" font-family="Poppins, sans-serif" font-size="20" font-weight="600">Selasa, 10 November 2026</text>
      <rect x="405" y="518" width="76" height="24" rx="12" fill="#fce8ec"/>
      <text x="443" y="535" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600">Hari ini</text>
      <text x="1336" y="536" fill="#6b6b6b" text-anchor="end" font-family="Inter, sans-serif" font-size="14">3 presensi</text>
      <path d="M80 563H1360" stroke="#eaeaea"/>
      <path d="M81 575a12 12 0 0 1 12-12h1255a12 12 0 0 1 12 12v44H81Z" fill="#fbf9f8"/>
      <g id="today-table-header" fill="#121212" font-family="Inter, sans-serif" font-size="13" font-weight="600">
        <text x="104" y="592">Nama</text><text x="270" y="592">Divisi</text>
        <text x="390" y="592">Masuk</text><text x="472" y="592">Pulang</text>
        <text x="554" y="592">Status</text><text x="680" y="592">Telat</text>
        <text x="762" y="592">Lembur</text><text x="866" y="592">Verifikasi Wajah</text>
      </g>
      <path d="M80 619H1360" stroke="#eaeaea"/>

      <g id="today-row-budi">
