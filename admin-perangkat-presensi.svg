<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120">
  <title>Perangkat Karyawan — Panel Admin Presensi QR</title>
  <desc>Prototype vektor halaman perangkat admin, mengikuti struktur dan komponen project Presensi QR. Data contoh untuk tampilan; impor SVG ini ke Figma untuk mengedit.</desc>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity=".05"/>
    </filter>
  </defs>
  <rect width="1440" height="1120" fill="#ffffff"/>

  <g id="header">
    <rect width="1440" height="84" fill="#ffffff"/>
    <g id="brand">
      <text x="80" y="40" fill="#121212" font-family="Poppins, sans-serif" font-size="22" font-weight="600">Presensi</text>
      <text x="179" y="40" fill="#dc143c" font-family="Poppins, sans-serif" font-size="22" font-weight="600">QR</text>
      <text x="80" y="63" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">Panel Admin</text>
    </g>
    <g id="account-actions">
      <circle cx="1124" cy="42" r="20" fill="#f5f3f3"/>
      <text x="1124" y="47" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">AD</text>
      <text x="1155" y="47" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Admin</text>
      <g id="theme-toggle">
        <rect x="1212" y="22" width="40" height="40" rx="12" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
        <path d="M1234.3 32.2a9 9 0 1 0 9.5 12.6 7.1 7.1 0 0 1-9.5-12.6Z" fill="none" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="logout-button">
        <rect x="1268" y="22" width="92" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="1314" y="47" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Keluar</text>
      </g>
    </g>
  </g>
  <path d="M0 83.5H1440" stroke="#eaeaea"/>

  <g id="admin-navigation" font-family="Inter, sans-serif" font-size="14">
    <text x="80" y="116" fill="#4a4a4a">Dashboard</text>
    <text x="192" y="116" fill="#4a4a4a">Karyawan</text>
    <text x="283" y="116" fill="#4a4a4a">Divisi</text>
    <text x="347" y="116" fill="#4a4a4a">Jam Kerja</text>
    <text x="444" y="116" fill="#4a4a4a">Persetujuan</text>
    <text x="568" y="116" fill="#4a4a4a">Presensi Manual</text>
    <text x="713" y="116" fill="#4a4a4a">Jaringan</text>
    <rect x="795" y="84" width="91" height="53" fill="#ffffff"/>
    <text x="802" y="116" fill="#121212" font-weight="600">Perangkat</text>
    <path d="M802 135.5H879" stroke="#dc143c" stroke-width="2"/>
    <text x="904" y="116" fill="#4a4a4a">Laporan</text>
  </g>
  <path d="M0 137.5H1440" stroke="#eaeaea"/>

  <g id="page-content">
    <text x="80" y="192" fill="#121212" font-family="Poppins, sans-serif" font-size="28" font-weight="600">Perangkat Karyawan</text>
    <text x="80" y="223" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">
      <tspan>Setiap akun karyawan terikat ke </tspan><tspan fill="#4a4a4a" font-weight="600">satu perangkat</tspan>
      <tspan> (browser) yang dipakai saat login pertama.</tspan>
    </text>
    <text x="80" y="245" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">Login dari perangkat lain ditolak dan masuk ke daftar permintaan di bawah.</text>

    <g id="new-device-requests-card">
      <rect x="80" y="271" width="1280" height="318" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <text x="104" y="314" fill="#121212" font-family="Poppins, sans-serif" font-size="22" font-weight="600">Permintaan Perangkat Baru (2)</text>
      <path d="M80 335H1360" stroke="#eaeaea"/>
      <path d="M81 348a12 12 0 0 1 12-12h1255a12 12 0 0 1 12 12v45H81Z" fill="#f5f3f3"/>
      <g id="request-table-header" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600">
        <text x="104" y="370">Karyawan</text>
        <text x="372" y="370">Perangkat</text>
        <text x="680" y="370">IP</text>
        <text x="874" y="370">Waktu</text>
      </g>
      <path d="M80 393H1360" stroke="#eaeaea"/>

      <g id="request-row-1">
        <text x="104" y="425" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600">Budi Santoso</text>
        <text x="104" y="446" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="13">KRY001</text>
        <rect x="372" y="408" width="31" height="38" rx="4" fill="#f5f3f3"/>
        <path d="M381 415h13v20h-13Zm5.5 17h2" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="416" y="432" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Android · Chrome</text>
        <text x="680" y="432" fill="#4a4a4a" font-family="ui-monospace, Consolas, monospace" font-size="14">192.168.1.25</text>
        <text x="874" y="432" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">10 Nov 08:42</text>
        <rect x="1060" y="401" width="134" height="40" rx="12" fill="#dc143c"/>
        <text x="1127" y="426" fill="#ffffff" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">Setujui</text>
        <rect x="1202" y="401" width="134" height="40" rx="12" fill="#ffdad6"/>
        <text x="1269" y="426" fill="#93000a" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">Tolak</text>
      </g>
      <path d="M80 463H1360" stroke="#eaeaea"/>

      <g id="request-row-2">
        <text x="104" y="495" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600">Siti Aminah</text>
        <text x="104" y="516" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="13">KRY002</text>
        <rect x="372" y="478" width="31" height="38" rx="4" fill="#f5f3f3"/>
        <path d="M381 485h13v20h-13Zm5.5 17h2" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="416" y="502" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">iOS · Safari</text>
        <text x="680" y="502" fill="#4a4a4a" font-family="ui-monospace, Consolas, monospace" font-size="14">10.20.30.45</text>
        <text x="874" y="502" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">10 Nov 08:15</text>
        <rect x="1060" y="471" width="134" height="40" rx="12" fill="#dc143c"/>
        <text x="1127" y="496" fill="#ffffff" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">Setujui</text>
        <rect x="1202" y="471" width="134" height="40" rx="12" fill="#ffdad6"/>
        <text x="1269" y="496" fill="#93000a" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">Tolak</text>
      </g>
      <path d="M80 533H1360" stroke="#eaeaea"/>
      <text x="720" y="562" fill="#9a9a9a" text-anchor="middle" font-family="Inter, sans-serif" font-size="14">Permintaan perangkat baru menunggu persetujuan admin.</text>
    </g>

    <g id="registered-devices-card">
      <rect x="80" y="613" width="1280" height="382" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <text x="104" y="656" fill="#121212" font-family="Poppins, sans-serif" font-size="22" font-weight="600">Perangkat Terdaftar</text>
      <path d="M80 677H1360" stroke="#eaeaea"/>
      <path d="M81 690a12 12 0 0 1 12-12h1255a12 12 0 0 1 12 12v45H81Z" fill="#f5f3f3"/>
      <g id="registered-table-header" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600">
        <text x="104" y="712">Karyawan</text>
        <text x="440" y="712">Perangkat</text>
        <text x="890" y="712">Terdaftar</text>
      </g>
      <path d="M80 735H1360" stroke="#eaeaea"/>

      <g id="registered-row-1">
        <text x="104" y="767" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600">Andi Pratama</text>
        <text x="104" y="788" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="13">KRY003</text>
        <text x="440" y="774" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Windows · Chrome</text>
        <text x="890" y="774" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">08 Nov 2026 07:55</text>
        <rect x="1240" y="747" width="96" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="1288" y="772" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">Reset</text>
      </g>
      <path d="M80 805H1360" stroke="#eaeaea"/>

      <g id="registered-row-2">
        <text x="104" y="837" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600">Joko Satpam</text>
        <text x="104" y="858" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="13">KRY004</text>
        <text x="440" y="844" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Android · Chrome</text>
        <text x="890" y="844" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">05 Nov 2026 19:42</text>
        <rect x="1240" y="817" width="96" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="1288" y="842" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">Reset</text>
      </g>
      <path d="M80 875H1360" stroke="#eaeaea"/>

      <g id="registered-row-3">
        <text x="104" y="907" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600">Maya Putri</text>
        <text x="104" y="928" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="13">KRY005</text>
        <text x="440" y="914" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="14">Belum ada (terdaftar saat login pertama)</text>
        <text x="890" y="914" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="14">-</text>
      </g>
      <path d="M80 945H1360" stroke="#eaeaea"/>
      <text x="104" y="976" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="13">Reset perangkat akan mengeluarkan karyawan dari sesi aktif.</text>
    </g>
  </g>
</svg>
