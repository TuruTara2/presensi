<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
  <title>Riwayat Kehadiran — Portal Karyawan Presensi QR</title>
  <desc>Prototype vektor halaman riwayat kehadiran karyawan. Mengikuti filter bulan dan kolom tabel project; baris yang ditampilkan adalah data contoh. Impor SVG ini ke Figma untuk mengedit.</desc>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity=".05"/>
    </filter>
  </defs>
  <rect width="1440" height="1024" fill="#ffffff"/>

  <g id="header">
    <rect width="1440" height="84" fill="#ffffff"/>
    <g id="brand">
      <text x="80" y="40" fill="#121212" font-family="Poppins, sans-serif" font-size="22" font-weight="600">Presensi</text>
      <text x="179" y="40" fill="#dc143c" font-family="Poppins, sans-serif" font-size="22" font-weight="600">QR</text>
      <text x="80" y="63" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">Portal Karyawan</text>
    </g>
    <g id="account-actions">
      <circle cx="1124" cy="42" r="20" fill="#fce8ec"/>
      <text x="1124" y="47" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600">BS</text>
      <text x="1155" y="47" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Budi Santoso</text>
      <g id="theme-toggle">
        <rect x="1212" y="22" width="40" height="40" rx="12" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
        <path d="M1234.3 32.2a9 9 0 1 0 9.5 12.6 7.1 7.1 0 0 1-9.5-12.6Z" fill="none" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="logout-button">
        <rect x="1268" y="22" width="92" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="1314" y="47" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Keluar</text>
      </g>
    </g>
  </g>
  <path d="M0 83.5H1440" stroke="#eaeaea"/>

  <g id="employee-navigation" font-family="Inter, sans-serif" font-size="14">
    <text x="80" y="116" fill="#4a4a4a">Presensi</text>
    <rect x="188" y="84" width="76" height="53" fill="#ffffff"/>
    <text x="195" y="116" fill="#121212" font-weight="600">Riwayat</text>
    <path d="M195 135.5H257" stroke="#dc143c" stroke-width="2"/>
    <text x="284" y="116" fill="#4a4a4a">Izin / Sakit / Cuti</text>
    <text x="431" y="116" fill="#4a4a4a">Profil</text>
  </g>
  <path d="M0 137.5H1440" stroke="#eaeaea"/>

  <g id="page-content">
    <text x="80" y="192" fill="#121212" font-family="Poppins, sans-serif" font-size="28" font-weight="600">Riwayat Kehadiran</text>

    <g id="month-filter">
      <text x="80" y="237" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Bulan</text>
      <rect x="80" y="249" width="232" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
      <text x="96" y="279" fill="#121212" font-family="Inter, sans-serif" font-size="14">November 2026</text>
      <rect x="272" y="262" width="16" height="15" rx="2" fill="none" stroke="#6b6b6b" stroke-width="1.5"/>
      <path d="M276 259v6m8-6v6m-12 3h16" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round"/>
      <g id="show-button">
        <rect x="324" y="257" width="112" height="40" rx="12" fill="#dc143c"/>
        <text x="380" y="282" fill="#ffffff" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Tampilkan</text>
      </g>
    </g>

    <g id="attendance-history-table">
      <rect x="80" y="321" width="1280" height="578" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <path d="M81 333a11 11 0 0 1 11-11h1258a10 10 0 0 1 10 10v54H81Z" fill="#f5f3f3"/>
      <g id="table-header" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600">
        <text x="104" y="357">Tanggal</text>
        <text x="347" y="357">Masuk</text>
        <text x="511" y="357">Pulang</text>
        <text x="675" y="357">Status</text>
        <text x="880" y="357">Terlambat</text>
        <text x="1084" y="357">Lembur</text>
      </g>
      <path d="M80 387H1360" stroke="#eaeaea"/>

      <g id="attendance-row-1" font-family="Inter, sans-serif" font-size="14">
        <text x="104" y="430" fill="#4a4a4a">Sel, 10 Nov 2026</text>
        <text x="347" y="430" fill="#4a4a4a">08:00</text>
        <text x="511" y="430" fill="#4a4a4a">17:00</text>
        <rect x="675" y="411" width="61" height="25" rx="4" fill="#e7f6eb"/>
        <text x="705.5" y="428" fill="#1e7e34" text-anchor="middle" font-weight="600">Hadir</text>
        <text x="880" y="430" fill="#4a4a4a">-</text>
        <text x="1084" y="430" fill="#4a4a4a">-</text>
      </g>
      <path d="M80 463H1360" stroke="#eaeaea"/>

      <g id="attendance-row-2" font-family="Inter, sans-serif" font-size="14">
        <text x="104" y="506" fill="#4a4a4a">Sen, 9 Nov 2026</text>
        <text x="347" y="506" fill="#4a4a4a">08:22</text>
        <text x="511" y="506" fill="#4a4a4a">18:10</text>
        <rect x="675" y="487" width="92" height="25" rx="4" fill="#fef3c7"/>
        <text x="721" y="504" fill="#92400e" text-anchor="middle" font-weight="600">Terlambat</text>
        <text x="880" y="506" fill="#4a4a4a">22 mnt</text>
        <text x="1084" y="506" fill="#4a4a4a">1 j 10 mnt</text>
      </g>
      <path d="M80 539H1360" stroke="#eaeaea"/>

      <g id="attendance-row-3" font-family="Inter, sans-serif" font-size="14">
        <text x="104" y="582" fill="#4a4a4a">Jum, 6 Nov 2026</text>
        <text x="347" y="582" fill="#4a4a4a">08:00</text>
        <text x="511" y="582" fill="#4a4a4a">17:00</text>
        <rect x="675" y="563" width="61" height="25" rx="4" fill="#e7f6eb"/>
        <text x="705.5" y="580" fill="#1e7e34" text-anchor="middle" font-weight="600">Hadir</text>
        <text x="880" y="582" fill="#4a4a4a">-</text>
        <text x="1084" y="582" fill="#4a4a4a">-</text>
      </g>
      <path d="M80 615H1360" stroke="#eaeaea"/>

      <g id="attendance-row-4" font-family="Inter, sans-serif" font-size="14">
        <text x="104" y="658" fill="#4a4a4a">Kam, 5 Nov 2026</text>
        <text x="347" y="658" fill="#4a4a4a">08:12</text>
        <text x="511" y="658" fill="#4a4a4a">17:05</text>
        <rect x="675" y="639" width="92" height="25" rx="4" fill="#fef3c7"/>
        <text x="721" y="656" fill="#92400e" text-anchor="middle" font-weight="600">Terlambat</text>
        <text x="880" y="658" fill="#4a4a4a">12 mnt</text>
        <text x="1084" y="658" fill="#4a4a4a">-</text>
      </g>
      <path d="M80 691H1360" stroke="#eaeaea"/>

      <g id="attendance-row-5" font-family="Inter, sans-serif" font-size="14">
        <text x="104" y="734" fill="#4a4a4a">Rab, 4 Nov 2026</text>
        <text x="347" y="734" fill="#4a4a4a">-</text>
        <text x="511" y="734" fill="#4a4a4a">-</text>
        <rect x="675" y="715" width="54" height="25" rx="4" fill="#f5f3f3"/>
        <text x="702" y="732" fill="#4a4a4a" text-anchor="middle" font-weight="600">Izin</text>
        <text x="880" y="734" fill="#4a4a4a">-</text>
        <text x="1084" y="734" fill="#4a4a4a">-</text>
      </g>
      <path d="M80 767H1360" stroke="#eaeaea"/>

      <g id="attendance-row-6" font-family="Inter, sans-serif" font-size="14">
        <text x="104" y="810" fill="#4a4a4a">Sel, 3 Nov 2026</text>
        <text x="347" y="810" fill="#4a4a4a">08:00</text>
        <text x="511" y="810" fill="#4a4a4a">17:00</text>
        <rect x="675" y="791" width="61" height="25" rx="4" fill="#e7f6eb"/>
        <text x="705.5" y="808" fill="#1e7e34" text-anchor="middle" font-weight="600">Hadir</text>
        <text x="880" y="810" fill="#4a4a4a">-</text>
        <text x="1084" y="810" fill="#4a4a4a">-</text>
      </g>
      <path d="M80 843H1360" stroke="#eaeaea"/>
      <text x="720" y="879" fill="#9a9a9a" text-anchor="middle" font-family="Inter, sans-serif" font-size="14">Riwayat ditampilkan dari tanggal terbaru.</text>
    </g>
  </g>
</svg>
