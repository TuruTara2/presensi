    <g id="pagination" font-family="Inter, sans-serif" font-size="14">
      <text x="80" y="909" fill="#6b6b6b">Menampilkan 1–5 dari data presensi bulan ini</text>
      <g id="pagination-controls">
        <rect x="1172" y="882" width="40" height="40" rx="10" fill="#ffffff" stroke="#eaeaea"/>
        <path d="m1196 896-6 6 6 6" fill="none" stroke="#9a9a9a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="1220" y="882" width="40" height="40" rx="10" fill="#dc143c"/>
        <text x="1240" y="907" fill="#ffffff" text-anchor="middle" font-weight="600">1</text>
        <rect x="1268" y="882" width="40" height="40" rx="10" fill="#ffffff" stroke="#eaeaea"/>
        <text x="1288" y="907" fill="#4a4a4a" text-anchor="middle">2</text>
        <rect x="1316" y="882" width="40" height="40" rx="10" fill="#ffffff" stroke="#eaeaea"/>
        <path d="m1332 896 6 6-6 6" fill="none" stroke="#4a4a4a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>
