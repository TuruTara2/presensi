<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1360" viewBox="0 0 1440 1360">
  <title>Profil Saya — Portal Karyawan Presensi QR</title>
  <desc>Prototype vektor halaman profil karyawan sesuai halaman dan design system project Presensi QR. Data contoh mengikuti seeder; impor SVG ini ke Figma untuk mengedit.</desc>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity=".05"/>
    </filter>
  </defs>
  <rect width="1440" height="1360" fill="#ffffff"/>

  <g id="header">
    <rect width="1440" height="84" fill="#ffffff"/>
    <g id="brand">
      <text x="80" y="40" fill="#121212" font-family="Poppins, sans-serif" font-size="22" font-weight="600">Presensi</text>
      <text x="179" y="40" fill="#dc143c" font-family="Poppins, sans-serif" font-size="22" font-weight="600">QR</text>
      <text x="80" y="63" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">Portal Karyawan</text>
    </g>
    <g id="account-actions">
      <circle cx="1124" cy="42" r="20" fill="#fce8ec"/>
      <text x="1124" y="47" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600">BS</text>
      <text x="1155" y="47" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Budi Santoso</text>
      <g id="theme-toggle">
        <rect x="1212" y="22" width="40" height="40" rx="12" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
        <path d="M1234.3 32.2a9 9 0 1 0 9.5 12.6 7.1 7.1 0 0 1-9.5-12.6Z" fill="none" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="logout-button">
        <rect x="1268" y="22" width="92" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="1314" y="47" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Keluar</text>
      </g>
    </g>
  </g>
  <path d="M0 83.5H1440" stroke="#eaeaea"/>

  <g id="employee-navigation" font-family="Inter, sans-serif" font-size="14">
    <text x="80" y="116" fill="#4a4a4a">Presensi</text>
    <text x="195" y="116" fill="#4a4a4a">Riwayat</text>
    <text x="284" y="116" fill="#4a4a4a">Izin / Sakit / Cuti</text>
    <rect x="424" y="84" width="60" height="53" fill="#ffffff"/>
    <text x="431" y="116" fill="#121212" font-weight="600">Profil</text>
    <path d="M431 135.5H477" stroke="#dc143c" stroke-width="2"/>
  </g>
  <path d="M0 137.5H1440" stroke="#eaeaea"/>

  <g id="page-content">
    <text x="80" y="192" fill="#121212" font-family="Poppins, sans-serif" font-size="28" font-weight="600">Profil Saya</text>

    <g id="identity-card">
      <rect x="80" y="216" width="1280" height="164" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <circle cx="156" cy="298" r="48" fill="#fce8ec"/>
      <text x="156" y="307" fill="#dc143c" text-anchor="middle" font-family="Poppins, sans-serif" font-size="28" font-weight="600">BS</text>
      <text x="228" y="280" fill="#121212" font-family="Poppins, sans-serif" font-size="28" font-weight="600">Budi Santoso</text>
      <text x="228" y="306" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">karyawan1@presensi.test</text>
      <rect x="228" y="326" width="86" height="28" rx="4" fill="#fce8ec"/>
      <text x="271" y="345" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">Karyawan</text>
      <rect x="322" y="326" width="94" height="28" rx="4" fill="#f5f3f3"/>
      <text x="369" y="345" fill="#4a4a4a" text-anchor="middle" font-family="Inter, sans-serif" font-size="13">NIP KRY001</text>
      <rect x="424" y="326" width="70" height="28" rx="4" fill="#f5f3f3"/>
      <text x="459" y="345" fill="#4a4a4a" text-anchor="middle" font-family="Inter, sans-serif" font-size="13">IT</text>
      <rect x="502" y="326" width="235" height="28" rx="4" fill="#f5f3f3"/>
      <text x="619.5" y="345" fill="#4a4a4a" text-anchor="middle" font-family="Inter, sans-serif" font-size="13">Shift Reguler · 08:00–17:00</text>
    </g>

    <g id="monthly-summary">
      <text x="80" y="424" fill="#121212" font-family="Poppins, sans-serif" font-size="22" font-weight="600">Ringkasan November 2026</text>
      <g id="on-time-summary-card">
        <rect x="80" y="444" width="302" height="132" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
        <text x="104" y="481" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">Tepat waktu</text>
        <text x="104" y="532" fill="#1e7e34" font-family="Poppins, sans-serif" font-size="36" font-weight="600">18</text>
        <text x="104" y="557" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="14">hari</text>
      </g>
      <g id="late-summary-card">
        <rect x="398" y="444" width="302" height="132" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
        <text x="422" y="481" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">Terlambat</text>
        <text x="422" y="532" fill="#d97706" font-family="Poppins, sans-serif" font-size="36" font-weight="600">2</text>
        <text x="422" y="557" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="14">hari</text>
      </g>
      <g id="leave-summary-card">
        <rect x="716" y="444" width="302" height="132" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
        <text x="740" y="481" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">Izin / Sakit / Cuti</text>
        <text x="740" y="532" fill="#4a4a4a" font-family="Poppins, sans-serif" font-size="36" font-weight="600">1</text>
        <text x="740" y="557" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="14">hari</text>
      </g>
      <g id="overtime-summary-card">
        <rect x="1034" y="444" width="326" height="132" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
        <text x="1058" y="481" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">Total lembur</text>
        <text x="1058" y="532" fill="#dc143c" font-family="Poppins, sans-serif" font-size="32" font-weight="600">3 j 30 mnt</text>
        <text x="1058" y="557" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="14">bulan ini</text>
      </g>
    </g>

    <g id="personal-details-card">
      <rect x="80" y="600" width="840" height="620" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <text x="104" y="642" fill="#121212" font-family="Poppins, sans-serif" font-size="22" font-weight="600">Data Diri</text>

      <g id="profile-photo-controls">
        <circle cx="160" cy="724" r="48" fill="#fce8ec"/>
        <text x="160" y="733" fill="#dc143c" text-anchor="middle" font-family="Poppins, sans-serif" font-size="27" font-weight="600">BS</text>
        <rect x="232" y="686" width="120" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="292" y="711" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Pilih foto</text>
        <text x="232" y="752" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">JPG, PNG, atau WEBP. Maksimal 2 MB.</text>
      </g>

      <g id="full-name-field">
        <text x="104" y="804" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Nama lengkap</text>
        <rect x="104" y="816" width="792" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="120" y="846" fill="#121212" font-family="Inter, sans-serif" font-size="16">Budi Santoso</text>
      </g>

      <g id="email-field">
        <text x="104" y="905" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Email</text>
        <rect x="104" y="917" width="380" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="120" y="947" fill="#121212" font-family="Inter, sans-serif" font-size="15">karyawan1@presensi.test</text>
      </g>

      <g id="phone-field">
        <text x="504" y="905" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">No. HP</text>
        <rect x="504" y="917" width="392" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="520" y="947" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="16">08xxxxxxxxxx</text>
      </g>

      <g id="save-profile-button">
        <rect x="104" y="1000" width="214" height="48" rx="12" fill="#dc143c"/>
        <text x="211" y="1030" fill="#ffffff" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Simpan Perubahan</text>
      </g>
    </g>

    <g id="security-card">
      <rect x="944" y="600" width="416" height="508" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <text x="968" y="642" fill="#121212" font-family="Poppins, sans-serif" font-size="22" font-weight="600">Keamanan</text>

      <g id="current-password-field">
        <text x="968" y="683" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Password saat ini</text>
        <rect x="968" y="695" width="368" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="984" y="726" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="18">••••••••</text>
        <g fill="none" stroke="#6b6b6b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1295 719s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
          <circle cx="1305" cy="719" r="3"/>
        </g>
      </g>

      <g id="new-password-field">
        <text x="968" y="784" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Password baru</text>
        <rect x="968" y="796" width="368" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="984" y="827" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="18">••••••••</text>
        <g fill="none" stroke="#6b6b6b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1295 820s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
          <circle cx="1305" cy="820" r="3"/>
        </g>
      </g>

      <g id="confirm-password-field">
        <text x="968" y="885" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Ulangi password baru</text>
        <rect x="968" y="897" width="368" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="984" y="928" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="18">••••••••</text>
        <g fill="none" stroke="#6b6b6b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1295 921s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
          <circle cx="1305" cy="921" r="3"/>
        </g>
      </g>

      <g id="change-password-button">
        <rect x="968" y="979" width="368" height="48" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="1152" y="1009" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Ganti Password</text>
      </g>
    </g>

    <g id="registered-device-card">
      <rect x="944" y="1124" width="416" height="196" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <text x="968" y="1166" fill="#121212" font-family="Poppins, sans-serif" font-size="22" font-weight="600">Perangkat Terdaftar</text>
      <rect x="968" y="1188" width="36" height="44" rx="6" fill="#f5f3f3"/>
      <path d="M978 1195h16v26h-16Zm7 22h2" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1016" y="1205" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600">Android · Chrome</text>
      <text x="1016" y="1227" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="13">Terdaftar 08 Nov 2026, 07:55</text>
      <text x="968" y="1262" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="12">Akunmu hanya bisa dipakai dari perangkat ini.</text>
      <text x="968" y="1281" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="12">Ganti HP? Hubungi admin untuk reset perangkat.</text>
    </g>
  </g>
</svg>
