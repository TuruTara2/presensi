<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
  <title>Verifikasi &amp; Persetujuan Izin — Panel Admin Presensi QR</title>
  <desc>Prototype vektor halaman persetujuan admin, mengikuti struktur dan komponen project Presensi QR. Data contoh untuk tampilan; impor SVG ini ke Figma untuk mengedit.</desc>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity=".05"/>
    </filter>
  </defs>
  <rect width="1440" height="1024" fill="#ffffff"/>

  <g id="header">
    <rect width="1440" height="84" fill="#ffffff"/>
    <g id="brand">
      <text x="80" y="40" fill="#121212" font-family="Poppins, sans-serif" font-size="22" font-weight="600">Presensi</text>
      <text x="179" y="40" fill="#dc143c" font-family="Poppins, sans-serif" font-size="22" font-weight="600">QR</text>
      <text x="80" y="63" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">Panel Admin</text>
    </g>
    <g id="account-actions">
      <circle cx="1124" cy="42" r="20" fill="#f5f3f3"/>
      <text x="1124" y="47" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">AD</text>
      <text x="1155" y="47" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Admin</text>
      <g id="theme-toggle">
        <rect x="1212" y="22" width="40" height="40" rx="12" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
        <path d="M1234.3 32.2a9 9 0 1 0 9.5 12.6 7.1 7.1 0 0 1-9.5-12.6Z" fill="none" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="logout-button">
        <rect x="1268" y="22" width="92" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="1314" y="47" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Keluar</text>
      </g>
    </g>
  </g>
  <path d="M0 83.5H1440" stroke="#eaeaea"/>

  <g id="admin-navigation" font-family="Inter, sans-serif" font-size="14">
    <text x="80" y="116" fill="#4a4a4a">Dashboard</text>
    <text x="192" y="116" fill="#4a4a4a">Karyawan</text>
    <text x="283" y="116" fill="#4a4a4a">Divisi</text>
    <text x="347" y="116" fill="#4a4a4a">Jam Kerja</text>
    <rect x="437" y="84" width="108" height="53" fill="#ffffff"/>
    <text x="444" y="116" fill="#121212" font-weight="600">Persetujuan</text>
    <path d="M444 135.5H538" stroke="#dc143c" stroke-width="2"/>
    <text x="568" y="116" fill="#4a4a4a">Presensi Manual</text>
    <text x="713" y="116" fill="#4a4a4a">Jaringan</text>
    <text x="802" y="116" fill="#4a4a4a">Perangkat</text>
    <text x="904" y="116" fill="#4a4a4a">Laporan</text>
  </g>
  <path d="M0 137.5H1440" stroke="#eaeaea"/>

  <g id="page-content">
    <text x="80" y="192" fill="#121212" font-family="Poppins, sans-serif" font-size="28" font-weight="600">Verifikasi &amp; Persetujuan Izin</text>

    <g id="status-filters" font-family="Inter, sans-serif" font-size="14" font-weight="600">
      <rect x="80" y="216" width="118" height="40" rx="12" fill="#dc143c"/>
      <text x="139" y="241" fill="#ffffff" text-anchor="middle">Menunggu</text>
      <rect x="206" y="216" width="120" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
      <text x="266" y="241" fill="#dc143c" text-anchor="middle">Disetujui</text>
      <rect x="334" y="216" width="90" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
      <text x="379" y="241" fill="#dc143c" text-anchor="middle">Ditolak</text>
      <rect x="432" y="216" width="82" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
      <text x="473" y="241" fill="#dc143c" text-anchor="middle">Semua</text>
    </g>

    <g id="request-budi">
      <rect x="80" y="276" width="1280" height="226" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <text x="104" y="311" fill="#121212" font-family="Inter, sans-serif" font-size="16" font-weight="600">Budi Santoso</text>
      <text x="211" y="311" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="14">IT</text>
      <rect x="104" y="324" width="55" height="25" rx="4" fill="#f5f3f3"/>
      <text x="131.5" y="341" fill="#4a4a4a" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">Izin</text>
      <text x="171" y="341" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">10 Nov 2026 - 11 Nov 2026</text>
      <text x="104" y="371" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Keperluan keluarga, mohon izin tidak masuk selama dua hari.</text>
      <g id="first-attachment-link">
        <path d="M105 390h12l4 4h16v16h-32Z" fill="none" stroke="#dc143c" stroke-width="1.5" stroke-linejoin="round"/>
        <text x="145" y="404" fill="#dc143c" font-family="Inter, sans-serif" font-size="14">Lihat lampiran</text>
      </g>
      <rect x="1260" y="294" width="76" height="26" rx="4" fill="#fef3c7"/>
      <text x="1298" y="312" fill="#92400e" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">Pending</text>
      <path d="M104 422H1336" stroke="#eaeaea"/>
      <text x="104" y="447" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600">Catatan (opsional)</text>
      <rect x="104" y="454" width="852" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
      <g id="approve-first">
        <rect x="972" y="458" width="174" height="40" rx="12" fill="#dc143c"/>
        <text x="1059" y="483" fill="#ffffff" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Setujui</text>
      </g>
      <g id="reject-first">
        <rect x="1158" y="458" width="178" height="40" rx="12" fill="#ffdad6"/>
        <text x="1247" y="483" fill="#93000a" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Tolak</text>
      </g>
    </g>

    <g id="request-siti" transform="translate(0 8)">
      <rect x="80" y="510" width="1280" height="226" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <text x="104" y="545" fill="#121212" font-family="Inter, sans-serif" font-size="16" font-weight="600">Siti Aminah</text>
      <text x="195" y="545" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="14">HRD</text>
      <rect x="104" y="558" width="59" height="25" rx="4" fill="#e0f2fe"/>
      <text x="133.5" y="575" fill="#075985" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">Sakit</text>
      <text x="175" y="575" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">10 Nov 2026 - 10 Nov 2026</text>
      <text x="104" y="605" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Sedang kurang sehat dan perlu istirahat hari ini.</text>
      <g id="second-attachment-link">
        <path d="M105 624h12l4 4h16v16h-32Z" fill="none" stroke="#dc143c" stroke-width="1.5" stroke-linejoin="round"/>
        <text x="145" y="638" fill="#dc143c" font-family="Inter, sans-serif" font-size="14">Lihat lampiran</text>
      </g>
      <rect x="1260" y="528" width="76" height="26" rx="4" fill="#fef3c7"/>
      <text x="1298" y="546" fill="#92400e" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">Pending</text>
      <path d="M104 656H1336" stroke="#eaeaea"/>
      <text x="104" y="681" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600">Catatan (opsional)</text>
      <rect x="104" y="688" width="852" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
      <g id="approve-second">
        <rect x="972" y="692" width="174" height="40" rx="12" fill="#dc143c"/>
        <text x="1059" y="717" fill="#ffffff" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Setujui</text>
      </g>
      <g id="reject-second">
        <rect x="1158" y="692" width="178" height="40" rx="12" fill="#ffdad6"/>
        <text x="1247" y="717" fill="#93000a" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Tolak</text>
      </g>
    </g>

    <g id="request-andi" transform="translate(0 16)">
      <rect x="80" y="744" width="1280" height="226" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <text x="104" y="779" fill="#121212" font-family="Inter, sans-serif" font-size="16" font-weight="600">Andi Pratama</text>
      <text x="211" y="779" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="14">Keuangan</text>
      <rect x="104" y="792" width="55" height="25" rx="4" fill="#eff6ff"/>
      <text x="131.5" y="809" fill="#1e40af" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">Cuti</text>
      <text x="171" y="809" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">12 Nov 2026 - 13 Nov 2026</text>
      <text x="104" y="839" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Mengajukan cuti tahunan yang telah direncanakan.</text>
      <rect x="1260" y="762" width="76" height="26" rx="4" fill="#fef3c7"/>
      <text x="1298" y="780" fill="#92400e" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">Pending</text>
      <path d="M104 890H1336" stroke="#eaeaea"/>
      <text x="104" y="915" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600">Catatan (opsional)</text>
      <rect x="104" y="922" width="852" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
      <g id="approve-third">
        <rect x="972" y="926" width="174" height="40" rx="12" fill="#dc143c"/>
        <text x="1059" y="951" fill="#ffffff" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Setujui</text>
      </g>
      <g id="reject-third">
        <rect x="1158" y="926" width="178" height="40" rx="12" fill="#ffdad6"/>
        <text x="1247" y="951" fill="#93000a" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Tolak</text>
      </g>
    </g>
  </g>
</svg>
