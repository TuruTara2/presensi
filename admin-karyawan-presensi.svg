        <text x="270" y="427" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600">AP</text>
        <text x="302" y="417" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600">Andi Pratama</text>
