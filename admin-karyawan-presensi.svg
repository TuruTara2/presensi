      <text x="127" y="269" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="14">Nama / NIP / email</text>

      <text x="384" y="228" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Divisi</text>
      <rect x="384" y="240" width="220" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
      <text x="400" y="269" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Semua</text>
      <path d="m582 259 6 6 6-6" fill="none" stroke="#6b6b6b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

