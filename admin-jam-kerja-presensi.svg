<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080">
  <title>Jam Kerja &amp; Toleransi Keterlambatan — Panel Admin Presensi QR</title>
  <desc>Prototype vektor halaman pengaturan jam kerja admin, mengikuti layout dan komponen project Presensi QR.</desc>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity=".05"/>
    </filter>
  </defs>
  <rect width="1440" height="1080" fill="#ffffff"/>

  <g id="header">
    <rect width="1440" height="84" fill="#ffffff"/>
    <g id="brand">
      <text x="80" y="40" fill="#121212" font-family="Poppins, sans-serif" font-size="22" font-weight="600">Presensi</text>
      <text x="179" y="40" fill="#dc143c" font-family="Poppins, sans-serif" font-size="22" font-weight="600">QR</text>
      <text x="80" y="63" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">Panel Admin</text>
    </g>
    <g id="account-actions">
      <circle cx="1124" cy="42" r="20" fill="#f5f3f3"/>
      <text x="1124" y="47" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">AD</text>
      <text x="1155" y="47" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Admin</text>
      <g id="theme-toggle">
        <rect x="1212" y="22" width="40" height="40" rx="12" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
        <path d="M1234.3 32.2a9 9 0 1 0 9.5 12.6 7.1 7.1 0 0 1-9.5-12.6Z" fill="none" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="logout-button">
        <rect x="1268" y="22" width="92" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="1314" y="47" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Keluar</text>
      </g>
    </g>
  </g>
  <path d="M0 83.5H1440" stroke="#eaeaea"/>

  <g id="admin-navigation" font-family="Inter, sans-serif" font-size="14">
    <text x="80" y="116" fill="#4a4a4a">Dashboard</text>
    <text x="192" y="116" fill="#4a4a4a">Karyawan</text>
    <text x="283" y="116" fill="#4a4a4a">Divisi</text>
    <rect x="340" y="84" width="94" height="53" fill="#ffffff"/>
    <text x="347" y="116" fill="#121212" font-weight="600">Jam Kerja</text>
    <path d="M347 135.5H427" stroke="#dc143c" stroke-width="2"/>
    <text x="444" y="116" fill="#4a4a4a">Persetujuan</text>
    <text x="568" y="116" fill="#4a4a4a">Presensi Manual</text>
    <text x="713" y="116" fill="#4a4a4a">Jaringan</text>
    <text x="802" y="116" fill="#4a4a4a">Perangkat</text>
    <text x="904" y="116" fill="#4a4a4a">Laporan</text>
  </g>
  <path d="M0 137.5H1440" stroke="#eaeaea"/>

  <g id="page-content">
    <text x="80" y="192" fill="#121212" font-family="Poppins, sans-serif" font-size="28" font-weight="600">Jam Kerja &amp; Toleransi Keterlambatan</text>

    <g id="shift-rules">
      <circle cx="87" cy="222" r="3" fill="#6b6b6b"/>
      <text x="98" y="227" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">
        <tspan fill="#4a4a4a" font-weight="600">Terlambat</tspan>
        <tspan> jika scan masuk melewati jam masuk + toleransi.</tspan>
      </text>
      <circle cx="87" cy="246" r="3" fill="#6b6b6b"/>
      <text x="98" y="251" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">
        <tspan>Jam pulang lebih kecil dari jam masuk (mis. 20:00 → 08:00) dianggap </tspan>
        <tspan fill="#4a4a4a" font-weight="600">shift malam</tspan>
        <tspan> melewati tengah malam.</tspan>
      </text>
      <circle cx="87" cy="270" r="3" fill="#6b6b6b"/>
      <text x="98" y="275" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">
        <tspan>Scan pulang setelah jam pulang dihitung </tspan>
        <tspan fill="#4a4a4a" font-weight="600">lembur.</tspan>
      </text>
    </g>

    <g id="add-shift-card">
      <rect x="80" y="298" width="1280" height="204" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <g id="new-shift-name">
        <text x="104" y="333" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Nama Shift Baru</text>
        <rect x="104" y="345" width="454" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
      </g>
      <g id="new-shift-start">
        <text x="578" y="333" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Jam Masuk</text>
        <rect x="578" y="345" width="217" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="594" y="375" fill="#121212" font-family="Inter, sans-serif" font-size="16">08:00</text>
        <path d="M766 360v17m-4-4 4 4 4-4" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="new-shift-end">
        <text x="815" y="333" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Jam Pulang</text>
        <rect x="815" y="345" width="217" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="831" y="375" fill="#121212" font-family="Inter, sans-serif" font-size="16">17:00</text>
        <path d="M1003 360v17m-4-4 4 4 4-4" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="new-shift-tolerance">
        <text x="1052" y="333" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Toleransi (menit)</text>
        <rect x="1052" y="345" width="284" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="1068" y="375" fill="#121212" font-family="Inter, sans-serif" font-size="16">15</text>
        <path d="m1309 363 5 5 5-5m-10 12 5-5 5 5" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="add-shift-button">
        <rect x="104" y="417" width="176" height="48" rx="12" fill="#dc143c"/>
        <text x="192" y="447" fill="#ffffff" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Tambah Shift</text>
      </g>
    </g>

    <g id="shift-regular-card">
      <rect x="80" y="526" width="1280" height="226" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <g id="regular-shift-name">
        <text x="104" y="563" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Nama</text>
        <rect x="104" y="575" width="454" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="120" y="605" fill="#121212" font-family="Inter, sans-serif" font-size="16">Reguler</text>
      </g>
      <g id="regular-shift-start">
        <text x="578" y="563" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Masuk</text>
        <rect x="578" y="575" width="217" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="594" y="605" fill="#121212" font-family="Inter, sans-serif" font-size="16">08:00</text>
        <path d="M766 590v17m-4-4 4 4 4-4" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="regular-shift-end">
        <text x="815" y="563" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Pulang</text>
        <rect x="815" y="575" width="217" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="831" y="605" fill="#121212" font-family="Inter, sans-serif" font-size="16">17:00</text>
        <path d="M1003 590v17m-4-4 4 4 4-4" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="regular-shift-tolerance">
        <text x="1052" y="563" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Toleransi (mnt)</text>
        <rect x="1052" y="575" width="284" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="1068" y="605" fill="#121212" font-family="Inter, sans-serif" font-size="16">15</text>
        <path d="m1309 593 5 5 5-5m-10 12 5-5 5 5" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="regular-shift-actions">
        <rect x="104" y="647" width="104" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="156" y="672" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Simpan</text>
        <text x="224" y="672" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="14">4 karyawan memakai shift ini</text>
        <rect x="1236" y="647" width="100" height="40" rx="12" fill="#ffdad6"/>
        <text x="1286" y="672" fill="#93000a" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Hapus</text>
      </g>
    </g>

    <g id="shift-night-card">
      <rect x="80" y="776" width="1280" height="226" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <g id="night-shift-name">
        <text x="104" y="813" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Nama</text>
        <rect x="104" y="825" width="454" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="120" y="855" fill="#121212" font-family="Inter, sans-serif" font-size="16">Malam</text>
      </g>
      <g id="night-shift-start">
        <text x="578" y="813" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Masuk</text>
        <rect x="578" y="825" width="217" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="594" y="855" fill="#121212" font-family="Inter, sans-serif" font-size="16">20:00</text>
        <path d="M766 840v17m-4-4 4 4 4-4" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="night-shift-end">
        <text x="815" y="813" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Pulang</text>
        <rect x="815" y="825" width="217" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="831" y="855" fill="#121212" font-family="Inter, sans-serif" font-size="16">08:00</text>
        <path d="M1003 840v17m-4-4 4 4 4-4" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="night-shift-tolerance">
        <text x="1052" y="813" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Toleransi (mnt)</text>
        <rect x="1052" y="825" width="284" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="1068" y="855" fill="#121212" font-family="Inter, sans-serif" font-size="16">15</text>
        <path d="m1309 843 5 5 5-5m-10 12 5-5 5 5" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="night-shift-actions">
        <rect x="104" y="897" width="104" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="156" y="922" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Simpan</text>
        <text x="224" y="922" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="14">1 karyawan memakai shift ini · shift malam</text>
        <rect x="1236" y="897" width="100" height="40" rx="12" fill="#ffdad6"/>
        <text x="1286" y="922" fill="#93000a" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Hapus</text>
      </g>
    </g>
  </g>
</svg>
