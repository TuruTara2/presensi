<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120">
  <title>Divisi / Departemen — Panel Admin Presensi QR</title>
  <desc>Prototype vektor halaman divisi admin, mengikuti layout dan komponen project Presensi QR. Data contoh mengikuti seeder project.</desc>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity=".05"/>
    </filter>
  </defs>
  <rect width="1440" height="1024" fill="#ffffff"/>

  <g id="header">
    <rect width="1440" height="84" fill="#ffffff"/>
    <g id="brand">
      <text x="80" y="40" fill="#121212" font-family="Poppins, sans-serif" font-size="22" font-weight="600">Presensi</text>
      <text x="179" y="40" fill="#dc143c" font-family="Poppins, sans-serif" font-size="22" font-weight="600">QR</text>
      <text x="80" y="63" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">Panel Admin</text>
    </g>
    <g id="account-actions">
      <circle cx="1124" cy="42" r="20" fill="#f5f3f3"/>
      <text x="1124" y="47" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600">AD</text>
      <text x="1155" y="47" fill="#4a4a4a" font-family="Inter, sans-serif" font-size="14">Admin</text>
      <g id="theme-toggle">
        <rect x="1212" y="22" width="40" height="40" rx="12" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
        <path d="M1234.3 32.2a9 9 0 1 0 9.5 12.6 7.1 7.1 0 0 1-9.5-12.6Z" fill="none" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="logout-button">
        <rect x="1268" y="22" width="92" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="1314" y="47" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Keluar</text>
      </g>
    </g>
  </g>
  <path d="M0 83.5H1440" stroke="#eaeaea"/>

  <g id="admin-navigation" font-family="Inter, sans-serif" font-size="14">
    <text x="80" y="116" fill="#4a4a4a">Dashboard</text>
    <text x="192" y="116" fill="#4a4a4a">Karyawan</text>
    <rect x="276" y="84" width="61" height="53" fill="#ffffff"/>
    <text x="283" y="116" fill="#121212" font-weight="600">Divisi</text>
    <path d="M283 135.5H335" stroke="#dc143c" stroke-width="2"/>
    <text x="347" y="116" fill="#4a4a4a">Jam Kerja</text>
    <text x="444" y="116" fill="#4a4a4a">Persetujuan</text>
    <text x="568" y="116" fill="#4a4a4a">Presensi Manual</text>
    <text x="713" y="116" fill="#4a4a4a">Jaringan</text>
    <text x="802" y="116" fill="#4a4a4a">Perangkat</text>
    <text x="904" y="116" fill="#4a4a4a">Laporan</text>
  </g>
  <path d="M0 137.5H1440" stroke="#eaeaea"/>

  <g id="page-content">
    <text x="80" y="192" fill="#121212" font-family="Poppins, sans-serif" font-size="28" font-weight="600">Divisi / Departemen</text>

    <g id="division-summary">
      <g id="total-divisions-card">
        <rect x="80" y="219" width="410" height="124" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
        <text x="104" y="258" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">Total divisi</text>
        <text x="104" y="316" fill="#121212" font-family="Poppins, sans-serif" font-size="36" font-weight="600">4</text>
      </g>
      <g id="active-employees-card">
        <rect x="515" y="219" width="410" height="124" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
        <text x="539" y="258" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">Karyawan aktif</text>
        <text x="539" y="316" fill="#121212" font-family="Poppins, sans-serif" font-size="36" font-weight="600">4</text>
      </g>
      <g id="unassigned-employees-card">
        <rect x="950" y="219" width="410" height="124" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
        <text x="974" y="258" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">Belum punya divisi</text>
        <text x="974" y="316" fill="#1e7e34" font-family="Poppins, sans-serif" font-size="36" font-weight="600">0</text>
      </g>
    </g>

    <g id="add-division-form">
      <rect x="80" y="367" width="1280" height="132" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
      <text x="104" y="405" fill="#121212" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing=".28">Tambah divisi baru</text>
      <rect x="104" y="419" width="980" height="48" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
      <text x="120" y="448" fill="#9a9a9a" font-family="Inter, sans-serif" font-size="16">Contoh: Marketing</text>
      <g id="add-division-button">
        <rect x="1100" y="419" width="236" height="48" rx="12" fill="#dc143c"/>
        <text x="1218" y="448" fill="#ffffff" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">+ Tambah Divisi</text>
      </g>
    </g>

    <g id="division-cards">
      <g id="division-it-card">
        <rect x="80" y="523" width="405" height="274" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
        <rect x="104" y="547" width="48" height="48" rx="12" fill="#fce8ec"/>
        <text x="128" y="578" fill="#dc143c" text-anchor="middle" font-family="Poppins, sans-serif" font-size="18" font-weight="600">IT</text>
        <text x="168" y="566" fill="#121212" font-family="Poppins, sans-serif" font-size="22" font-weight="600">IT</text>
        <text x="168" y="590" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">1 karyawan</text>
        <circle cx="120" cy="627" r="16" fill="#fce8ec" stroke="#ffffff" stroke-width="2"/>
        <text x="120" y="632" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600">BS</text>
        <text x="104" y="677" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">Hadir hari ini</text>
        <text x="461" y="677" fill="#121212" text-anchor="end" font-family="Inter, sans-serif" font-size="14" font-weight="600">0/1</text>
        <rect x="104" y="691" width="357" height="8" rx="4" fill="#f5f3f3"/>
        <rect x="104" y="691" width="0" height="8" rx="4" fill="#28a745"/>
        <path d="M104 723H461" stroke="#eaeaea"/>
        <rect x="104" y="739" width="229" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="218.5" y="764" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Ubah nama</text>
        <rect x="341" y="739" width="120" height="40" rx="12" fill="#ffdad6"/>
        <text x="401" y="764" fill="#93000a" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Hapus</text>
      </g>

      <g id="division-hrd-card">
        <rect x="517" y="523" width="405" height="274" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
        <rect x="541" y="547" width="48" height="48" rx="12" fill="#fce8ec"/>
        <text x="565" y="578" fill="#dc143c" text-anchor="middle" font-family="Poppins, sans-serif" font-size="18" font-weight="600">HR</text>
        <text x="605" y="566" fill="#121212" font-family="Poppins, sans-serif" font-size="22" font-weight="600">HRD</text>
        <text x="605" y="590" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">1 karyawan</text>
        <circle cx="557" cy="627" r="16" fill="#fce8ec" stroke="#ffffff" stroke-width="2"/>
        <text x="557" y="632" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600">SA</text>
        <text x="541" y="677" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">Hadir hari ini</text>
        <text x="898" y="677" fill="#121212" text-anchor="end" font-family="Inter, sans-serif" font-size="14" font-weight="600">0/1</text>
        <rect x="541" y="691" width="357" height="8" rx="4" fill="#f5f3f3"/>
        <rect x="541" y="691" width="0" height="8" rx="4" fill="#28a745"/>
        <path d="M541 723H898" stroke="#eaeaea"/>
        <rect x="541" y="739" width="229" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="655.5" y="764" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Ubah nama</text>
        <rect x="778" y="739" width="120" height="40" rx="12" fill="#ffdad6"/>
        <text x="838" y="764" fill="#93000a" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Hapus</text>
      </g>

      <g id="division-finance-card">
        <rect x="955" y="523" width="405" height="274" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
        <rect x="979" y="547" width="48" height="48" rx="12" fill="#fce8ec"/>
        <text x="1003" y="578" fill="#dc143c" text-anchor="middle" font-family="Poppins, sans-serif" font-size="18" font-weight="600">KE</text>
        <text x="1043" y="566" fill="#121212" font-family="Poppins, sans-serif" font-size="22" font-weight="600">Keuangan</text>
        <text x="1043" y="590" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">1 karyawan</text>
        <circle cx="995" cy="627" r="16" fill="#fce8ec" stroke="#ffffff" stroke-width="2"/>
        <text x="995" y="632" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600">AP</text>
        <text x="979" y="677" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">Hadir hari ini</text>
        <text x="1336" y="677" fill="#121212" text-anchor="end" font-family="Inter, sans-serif" font-size="14" font-weight="600">0/1</text>
        <rect x="979" y="691" width="357" height="8" rx="4" fill="#f5f3f3"/>
        <rect x="979" y="691" width="0" height="8" rx="4" fill="#28a745"/>
        <path d="M979 723H1336" stroke="#eaeaea"/>
        <rect x="979" y="739" width="229" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="1093.5" y="764" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Ubah nama</text>
        <rect x="1216" y="739" width="120" height="40" rx="12" fill="#ffdad6"/>
        <text x="1276" y="764" fill="#93000a" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Hapus</text>
      </g>

      <g id="division-security-card">
        <rect x="80" y="819" width="405" height="274" rx="12" fill="#ffffff" stroke="#eaeaea" filter="url(#card-shadow)"/>
        <rect x="104" y="843" width="48" height="48" rx="12" fill="#fce8ec"/>
        <text x="128" y="874" fill="#dc143c" text-anchor="middle" font-family="Poppins, sans-serif" font-size="18" font-weight="600">KE</text>
        <text x="168" y="862" fill="#121212" font-family="Poppins, sans-serif" font-size="22" font-weight="600">Keamanan</text>
        <text x="168" y="886" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">1 karyawan</text>
        <circle cx="120" cy="923" r="16" fill="#fce8ec" stroke="#ffffff" stroke-width="2"/>
        <text x="120" y="928" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600">JS</text>
        <text x="104" y="974" fill="#6b6b6b" font-family="Inter, sans-serif" font-size="14">Hadir hari ini</text>
        <text x="461" y="974" fill="#121212" text-anchor="end" font-family="Inter, sans-serif" font-size="14" font-weight="600">0/1</text>
        <rect x="104" y="985" width="357" height="8" rx="4" fill="#f5f3f3"/>
        <rect x="104" y="985" width="0" height="8" rx="4" fill="#28a745"/>
        <path d="M104 1017H461" stroke="#eaeaea"/>
        <rect x="104" y="1033" width="229" height="40" rx="12" fill="#ffffff" stroke="#dc143c" stroke-width="1.5"/>
        <text x="218.5" y="1058" fill="#dc143c" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Ubah nama</text>
        <rect x="341" y="1033" width="120" height="40" rx="12" fill="#ffdad6"/>
        <text x="401" y="1058" fill="#93000a" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Hapus</text>
      </g>
    </g>
  </g>
</svg>
